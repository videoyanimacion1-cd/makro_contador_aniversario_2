<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contador Makro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="contador">

    <img id="fondo" src="assets/fondo.png" alt="Fondo">

    <!-- DÍAS -->
    <div id="dias" class="grupo">

        <div class="titulo"></div>

        <div class="digitos">
            <div class="caja"><span id="dia1">0</span></div>
            <div class="caja"><span id="dia2">0</span></div>
        </div>

    </div>

    <!-- HORAS -->
    <div id="horas" class="grupo">

        <div class="titulo"></div>

        <div class="digitos">
            <div class="caja"><span id="hora1">0</span></div>
            <div class="caja"><span id="hora2">0</span></div>
        </div>

    </div>

    <!-- MINUTOS -->
    <div id="minutos" class="grupo">

        <div class="titulo"></div>

        <div class="digitos">
            <div class="caja"><span id="min1">0</span></div>
            <div class="caja"><span id="min2">0</span></div>
        </div>

    </div>

    <!-- SEGUNDOS -->
    <div id="segundos" class="grupo">

        <div class="titulo"></div>

        <div class="digitos">
            <div class="caja"><span id="seg1">0</span></div>
            <div class="caja"><span id="seg2">0</span></div>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
